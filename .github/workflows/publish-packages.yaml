name: Publish package to npmjs

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Validate release tag
        id: package
        run: bun run .github/scripts/resolve-release-package.ts >> "$GITHUB_OUTPUT"

      - name: Build package and workspace dependencies
        run: bunx turbo run build --filter="${{ steps.package.outputs.name }}..."

      - name: Publish package
        working-directory: packages/${{ steps.package.outputs.name }}
        run: bun publish --no-git-checks --provenance --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
